<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f7"><title>English Quest V8</title>
<style>
:root{--g:#1cb0f6;--gd:#168ac0;--blue:#1cb0f6;--red:#ff4b4b;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;--bg:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f7f7f7;color:var(--ink)}button{font:inherit}
.app{max-width:560px;margin:auto;min-height:100vh;background:white}.home{padding:18px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:#fffc;backdrop-filter:blur(12px);z-index:5;padding:8px 0 14px}
.brand{font-weight:1000;font-size:22px;color:var(--g)}.stats{display:flex;gap:12px;font-weight:900}.heart{color:var(--red)}.xp{color:#ffb100}
.hero{background:linear-gradient(135deg,#1cb0f6,#49c6ff);border-radius:22px;padding:18px;color:white;box-shadow:0 6px 0 #168ac0;margin:8px 0 24px}.hero h1{margin:0 0 5px;font-size:22px}.hero p{margin:0;opacity:.92;font-size:13px}
.unit{margin:26px 0 12px;text-align:center}.unit h2{font-size:16px;margin:0}.unit p{font-size:12px;color:var(--mut);margin:5px}
.path{display:flex;flex-direction:column;align-items:center;gap:17px}.lesson{position:relative;width:76px;height:76px;border:0;border-radius:50%;background:#e5e5e5;box-shadow:0 7px 0 #cfcfcf;color:#999;font-weight:1000;font-size:18px;transition:.15s}.lesson:nth-child(3n+1){transform:translateX(-45px)}.lesson:nth-child(3n+2){transform:translateX(5px)}.lesson:nth-child(3n){transform:translateX(45px)}
.lesson.open{background:var(--g);box-shadow:0 7px 0 var(--gd);color:white}.lesson.done{background:#ffc800;box-shadow:0 7px 0 #d9aa00;color:white}.lesson:active{transform:translateY(5px)}.lesson svg{display:none}.lesson{font-size:27px;line-height:1}.tag{position:absolute;white-space:nowrap;right:88px;top:20px;background:white;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11px;color:#666}
.lesson-screen{display:none;min-height:100vh;padding:16px 18px 120px}.lesson-screen.on{display:block}.home.hide{display:none}.lhead{display:flex;align-items:center;gap:12px;direction:ltr}.close{border:0;background:none;font-size:25px;color:#aaa}.prog{height:16px;flex:1;background:#e5e5e5;border-radius:99px;overflow:hidden}.prog div{height:100%;background:var(--g);border-radius:99px;transition:.35s}.hearts{color:var(--red);font-weight:1000}
.stage{padding-top:35px}.eyebrow{color:#999;font-size:13px;font-weight:800}.stage h2{font-size:25px;margin:8px 0 20px}.phrase{direction:ltr;text-align:left;border-bottom:2px dashed #ddd;padding:13px 0;font-size:20px;line-height:1.5}.listen{width:82px;height:82px;border:0;border-radius:20px;background:var(--blue);box-shadow:0 6px 0 #168ac0;color:white;font-size:34px;margin:20px auto;display:block}
.options{display:grid;gap:10px}.opt{direction:ltr;text-align:left;padding:15px;border:2px solid var(--line);border-radius:14px;background:white;box-shadow:0 3px 0 var(--line);font-weight:750}.opt.sel{border-color:var(--blue);background:#e8f7fe;color:#137dab}.words{display:flex;flex-wrap:wrap;gap:9px;direction:ltr;min-height:70px;border-bottom:2px solid #eee;padding:10px 0}.word{padding:10px 12px;background:white;border:2px solid #ddd;border-radius:10px;box-shadow:0 2px 0 #ddd}.bank{display:flex;flex-wrap:wrap;gap:9px;direction:ltr;margin-top:22px}.scenario{background:#f7f7f7;border:2px solid #eee;border-radius:18px;padding:16px;direction:ltr;text-align:left;margin-bottom:18px}.who{font-size:12px;color:#999;font-weight:900}.bubble{font-size:18px;margin-top:5px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:white;border-top:2px solid #eee;z-index:10}.check{width:100%;border:0;border-radius:14px;padding:15px;background:var(--g);box-shadow:0 5px 0 var(--gd);color:white;font-weight:1000;text-transform:uppercase}.check.disabled{background:#e5e5e5;box-shadow:0 5px 0 #ccc;color:#aaa}
.feedback{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:18px;background:#dff4ff;z-index:20;display:none}.feedback.bad{background:#ffdfe0}.feedback.show{display:block}.feedback h3{margin:0 0 10px;color:#137dab}.feedback.bad h3{color:#d33131}.feedback button{width:100%;padding:14px;border:0;border-radius:13px;background:var(--g);color:white;font-weight:1000}.feedback.bad button{background:var(--red)}
.result{text-align:center;padding:55px 10px}.trophy{width:125px;height:125px;margin:auto;animation:bounce .7s ease}.trophy svg{width:100%;height:100%}@keyframes bounce{50%{transform:translateY(-12px) rotate(-4deg)}}.result h1{font-size:29px}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:25px 0}.resultbox{border:2px solid #eee;border-radius:15px;padding:13px}.resultbox b{font-size:22px;color:#ffb100}

.artrans{direction:rtl;text-align:right;color:#777;font-size:13px;margin-top:6px;font-weight:500}
.explain{direction:rtl;text-align:right;margin-top:8px;color:#555;font-size:14px}

.interview-entry{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:white;color:#137dab;font-weight:1000;box-shadow:0 4px 0 #d7edf8}.interview-entry span{display:block;font-size:11px;color:#777;margin-top:3px}
.interview-card{border:2px solid #e5e5e5;border-radius:18px;padding:16px;margin:12px 0}.interview-card h3{direction:ltr;text-align:left;margin:0 0 10px}.answer{direction:ltr;text-align:left;background:#f7f7f7;border-radius:12px;padding:12px}.arabic{direction:rtl;text-align:right;color:#777;font-size:13px;margin-top:8px}

.interview-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.i-btn{border:0!important;border-radius:14px!important;padding:13px 10px!important;font-weight:900!important;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.10);cursor:pointer}
.i-listen{background:#e8f7fe!important;color:#137dab!important}.i-record{background:#1cb0f6!important;color:#fff!important}
.i-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
.i-icon{width:24px;height:24px;display:inline-grid;place-items:center;border-radius:50%;font-size:16px}
.interview-card{box-shadow:0 3px 0 #eee;background:#fff}
.interview-count{background:#e8f7fe;color:#137dab;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:900;display:inline-block;margin-bottom:10px}

.learning-entry{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#fff;color:#137dab;font-weight:1000;box-shadow:0 4px 0 #d7edf8}.learning-entry span{display:block;font-size:11px;color:#777;margin-top:3px}
.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.hubcard{border:2px solid #e5e5e5;border-radius:18px;padding:16px;background:#fff;text-align:right;min-height:125px;box-shadow:0 4px 0 #e5e5e5}.hubcard b{display:block;font-size:16px;margin:8px 0 4px}.hubcard small{color:#777}.hubicon{font-size:30px}
.skill{margin:15px 0}.skillrow{display:flex;justify-content:space-between;font-weight:800;font-size:13px}.skillbar{height:11px;background:#eee;border-radius:99px;margin-top:7px;overflow:hidden}.skillbar i{display:block;height:100%;background:#1cb0f6;border-radius:99px}
.panel{border:2px solid #e5e5e5;border-radius:18px;padding:16px;margin:14px 0}.vocabword{font-size:22px;font-weight:1000;direction:ltr;text-align:left}.textarea{width:100%;min-height:130px;border:2px solid #ddd;border-radius:14px;padding:13px;font:inherit;resize:vertical}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#e8f7fe;color:#137dab;font-size:11px;font-weight:900;margin:3px}

.dailyhero{border-radius:20px;padding:17px;background:linear-gradient(135deg,#e9f8ff,#fff);border:2px solid #cfeefe;margin:14px 0}
.dailydate{font-size:12px;font-weight:900;color:#168ac0}.todaytag{display:inline-block;background:#1cb0f6;color:#fff;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:1000}
.ai-box{border:2px solid #cfeefe;border-radius:18px;padding:16px;margin:14px 0;background:#fbfeff}.ai-status{font-size:12px;color:#777;margin:7px 0}.ai-output{white-space:pre-wrap;line-height:1.8;border-radius:14px;background:#f5f5f5;padding:13px;margin-top:12px}.ai-btn{width:100%;border:0;border-radius:14px;padding:13px;background:#1cb0f6;color:#fff;font-weight:1000;box-shadow:0 4px 0 #168ac0;margin-top:8px}.ai-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #168ac0}
</style></head><body><div class="app"><main id="home" class="home">
<div class="top"><div class="brand">English Quest</div><div class="stats"><span class="xp">⚡ <b id="xp">0</b></span><span>🔥 <b id="streak">0</b></span></div></div>
<section class="hero"><h1>Business English Quest 🚀</h1><p>30 يوم • 90 درس • Speaking • Listening • Business English • IT/QA</p><button class="interview-entry" onclick="openInterview()">💼 قسم المقابلات الوظيفية <span>تدريب + تسجيل + أسئلة وأجوبة</span></button>
<button class="learning-entry" onclick="openHub()">🧠 مركز التعلم الذكي <span>مراجعة • كلمات • تحدي يومي • Grammar • Writing • تقدم المهارات</span></button>
</section>
<div id="map"></div></main>
<main id="lesson" class="lesson-screen"><div class="lhead"><button class="close" onclick="exitLesson()">×</button><div class="prog"><div id="pbar"></div></div><div class="hearts" id="hearts">♥ ∞</div></div><section id="stage" class="stage"></section></main><main id="interview" class="lesson-screen"><div class="lhead"><button class="close" onclick="closeInterview()">×</button><div style="font-weight:1000;font-size:18px">Job Interview Practice 💼</div></div><section id="interviewStage" class="stage"></section></main><main id="hub" class="lesson-screen"><div class="lhead"><button class="close" onclick="closeHub()">×</button><div style="font-weight:1000;font-size:18px">Smart Learning Center 🧠</div></div><section id="hubStage" class="stage"></section></main></div>
<div id="bottom" class="bottom" style="display:none"><button id="check" class="check disabled" onclick="check()">تحقق</button></div>
<div id="feedback" class="feedback"><h3 id="ft"></h3><div id="fd"></div><button onclick="next()">متابعة</button></div>
<script>const INTERVIEWS=[{"q": "Tell me about yourself.", "a": "I’m a QA specialist with experience in software testing and working closely with cross-functional teams.", "ar": "أنا أخصائي ضمان جودة ولدي خبرة في اختبار البرمجيات والعمل بشكل وثيق مع فرق متعددة التخصصات."}, {"q": "Why are you interested in this position?", "a": "This role matches my experience, and I’m excited about the opportunity to learn, contribute, and grow with the team.", "ar": "هذه الوظيفة تتوافق مع خبرتي، وأنا متحمس لفرصة التعلم والمساهمة والتطور مع الفريق."}, {"q": "What are your strengths?", "a": "I’m organized, detail-oriented, and I communicate well with different team members.", "ar": "أنا منظم، أهتم بالتفاصيل، وأتواصل بشكل جيد مع مختلف أعضاء الفريق."}, {"q": "What is one area you are working to improve?", "a": "I’m working on becoming more confident when speaking English in meetings, and I practice consistently.", "ar": "أعمل على زيادة ثقتي عند التحدث بالإنجليزية في الاجتماعات، وأتدرب باستمرار."}, {"q": "Why should we hire you?", "a": "I can bring a strong quality mindset, good communication, and a willingness to learn quickly and take responsibility.", "ar": "أستطيع أن أضيف عقلية قوية تجاه الجودة، وتواصلًا جيدًا، واستعدادًا للتعلم بسرعة وتحمل المسؤولية."}, {"q": "Tell me about a difficult situation at work.", "a": "I first understood the problem, communicated clearly with the people involved, and focused on finding a practical solution.", "ar": "بدأت أولًا بفهم المشكلة، ثم تواصلت بوضوح مع المعنيين، وركزت على إيجاد حل عملي."}, {"q": "How do you handle disagreements with a colleague?", "a": "I listen to their point of view, explain my concerns respectfully, and focus on what is best for the project.", "ar": "أستمع إلى وجهة نظره، وأوضح ملاحظاتي باحترام، وأركز على ما هو الأفضل للمشروع."}, {"q": "How do you prioritize your work?", "a": "I consider urgency, business impact, dependencies, and deadlines before deciding what to work on first.", "ar": "أراعي الاستعجال وتأثير المهمة على العمل والاعتماديات والمواعيد قبل تحديد الأولوية."}, {"q": "Where do you see yourself in the next few years?", "a": "I want to deepen my technical and communication skills, take on more responsibility, and continue growing professionally.", "ar": "أرغب في تطوير مهاراتي التقنية والتواصلية، وتحمل مسؤوليات أكبر، والاستمرار في التطور مهنيًا."}, {"q": "Do you have any questions for us?", "a": "Yes. What would success look like in this role during the first three to six months?", "ar": "نعم. كيف يبدو النجاح في هذه الوظيفة خلال أول ثلاثة إلى ستة أشهر؟"}, {"q": "Walk me through your experience.", "a": "I have experience working with teams, handling daily tasks, following up on issues, and making sure work is completed clearly and on time.", "ar": "لدي خبرة في العمل مع الفرق، وإدارة المهام اليومية، ومتابعة المشكلات، والتأكد من إنجاز العمل بوضوح وفي الوقت المحدد."}, {"q": "Why are you looking for a new opportunity?", "a": "I’m looking for a role where I can take on new challenges, develop my skills, and contribute to a strong team.", "ar": "أبحث عن وظيفة تمنحني تحديات جديدة وتساعدني على تطوير مهاراتي والمساهمة مع فريق قوي."}, {"q": "What motivates you at work?", "a": "I’m motivated by learning, solving problems, seeing clear results, and contributing to the team’s success.", "ar": "يحفزني التعلم وحل المشكلات ورؤية نتائج واضحة والمساهمة في نجاح الفريق."}, {"q": "How do you work under pressure?", "a": "I stay organized, focus on priorities, communicate early, and handle one important task at a time.", "ar": "أحافظ على التنظيم، وأركز على الأولويات، وأتواصل مبكرًا، وأتعامل مع المهام المهمة واحدة تلو الأخرى."}, {"q": "Tell me about a time you made a mistake.", "a": "I take responsibility, understand what caused the mistake, fix it, and make sure I learn from it.", "ar": "أتحمل المسؤولية، وأفهم سبب الخطأ، وأعمل على إصلاحه والتعلم منه."}, {"q": "Tell me about an achievement you are proud of.", "a": "I’m proud of situations where I helped the team solve a problem and deliver work successfully under a tight deadline.", "ar": "أفتخر بالمواقف التي ساعدت فيها الفريق على حل مشكلة وإنجاز العمل بنجاح ضمن وقت محدود."}, {"q": "How do you communicate with different teams?", "a": "I keep my communication clear, provide the necessary context, and make sure everyone understands the next steps.", "ar": "أحرص على أن يكون تواصلي واضحًا، وأوفر السياق اللازم، وأتأكد من فهم الجميع للخطوات التالية."}, {"q": "How do you handle feedback?", "a": "I listen carefully, ask questions if needed, and use feedback as an opportunity to improve.", "ar": "أستمع بعناية، وأسأل عند الحاجة، وأستخدم الملاحظات كفرصة للتطور."}, {"q": "Describe your ideal work environment.", "a": "I work best in a collaborative environment with clear goals, open communication, and opportunities to learn.", "ar": "أعمل بشكل أفضل في بيئة تعاونية ذات أهداف واضحة وتواصل مفتوح وفرص للتعلم."}, {"q": "How do you manage multiple tasks?", "a": "I organize my tasks by priority and deadline, track my progress, and communicate if priorities change.", "ar": "أنظم مهامي حسب الأولوية والموعد، وأتابع تقدمي، وأتواصل إذا تغيرت الأولويات."}, {"q": "How would your colleagues describe you?", "a": "They would probably describe me as cooperative, responsible, calm, and willing to help.", "ar": "غالبًا سيصفني زملائي بأنني متعاون ومسؤول وهادئ ومستعد للمساعدة."}, {"q": "What do you know about our company?", "a": "I researched the company, its services, and its recent work, and I’m interested in how this role contributes to its goals.", "ar": "بحثت عن الشركة وخدماتها وأعمالها الأخيرة، ويهمني معرفة كيف تساهم هذه الوظيفة في أهدافها."}, {"q": "What are your salary expectations?", "a": "I’m open to discussing a fair package based on the role, responsibilities, and the overall opportunity.", "ar": "أنا منفتح لمناقشة عرض مناسب بناءً على الوظيفة ومسؤولياتها والفرصة بشكل عام."}, {"q": "When can you start?", "a": "I can discuss the start date based on the company’s needs and my current commitments.", "ar": "يمكنني مناقشة تاريخ البدء بناءً على احتياج الشركة والتزاماتي الحالية."}, {"q": "Tell me about a conflict you resolved.", "a": "I listened to both sides, focused on the facts, and worked toward a solution that supported the team’s goal.", "ar": "استمعت للطرفين، وركزت على الحقائق، وعملت للوصول إلى حل يخدم هدف الفريق."}, {"q": "How do you learn a new tool or system?", "a": "I start with the basics, practice with real examples, ask focused questions, and document what I learn.", "ar": "أبدأ بالأساسيات، وأتدرب على أمثلة حقيقية، وأسأل أسئلة محددة، وأوثق ما أتعلمه."}, {"q": "How do you explain a technical issue to a non-technical person?", "a": "I avoid unnecessary technical terms and explain the impact, the cause, and the next step in simple language.", "ar": "أتجنب المصطلحات التقنية غير الضرورية وأشرح التأثير والسبب والخطوة التالية بلغة بسيطة."}, {"q": "Tell me about your experience working with developers.", "a": "I communicate issues clearly, provide useful details, discuss expected behavior, and follow up until the issue is resolved.", "ar": "أوضح المشكلات للمطورين، وأوفر التفاصيل اللازمة، وأناقش السلوك المتوقع، وأتابع حتى يتم حل المشكلة."}, {"q": "How do you ensure quality in your work?", "a": "I review requirements carefully, check important scenarios, document results, and follow up on issues.", "ar": "أراجع المتطلبات بعناية، وأتحقق من السيناريوهات المهمة، وأوثق النتائج، وأتابع المشكلات."}, {"q": "What would you do if a requirement was unclear?", "a": "I would ask focused questions, confirm the expected behavior, and avoid making assumptions before starting.", "ar": "سأطرح أسئلة محددة، وأتأكد من السلوك المتوقع، وأتجنب الافتراضات قبل البدء."}, {"q": "How do you handle a tight deadline?", "a": "I identify the highest-impact work, communicate risks early, and focus on delivering the most important items first.", "ar": "أحدد الأعمال الأعلى تأثيرًا، وأوضح المخاطر مبكرًا، وأركز على إنجاز الأهم أولًا."}, {"q": "What is your leadership style?", "a": "I believe in clear communication, shared responsibility, supporting others, and keeping the team focused on the goal.", "ar": "أؤمن بالتواصل الواضح والمسؤولية المشتركة ودعم الآخرين والحفاظ على تركيز الفريق على الهدف."}, {"q": "What makes you different from other candidates?", "a": "I combine a quality-focused mindset with teamwork, clear communication, and a strong willingness to keep learning.", "ar": "أجمع بين الاهتمام بالجودة والعمل الجماعي والتواصل الواضح والرغبة القوية في الاستمرار بالتعلم."}, {"q": "What are you looking for in your next manager?", "a": "I value clear expectations, constructive feedback, trust, and opportunities to take responsibility.", "ar": "أقدّر وضوح التوقعات والملاحظات البنّاءة والثقة وفرص تحمل المسؤولية."}, {"q": "How do you prepare for an important meeting?", "a": "I review the objective, prepare the key points and questions, and make sure I have the information I may need.", "ar": "أراجع هدف الاجتماع، وأجهز النقاط والأسئلة المهمة، وأتأكد من توفر المعلومات التي قد أحتاجها."}, {"q": "How do you respond when you do not know an answer?", "a": "I’m transparent about it, verify the information, and come back with an accurate answer instead of guessing.", "ar": "أكون واضحًا بأنني لا أعرف الإجابة، ثم أتحقق من المعلومات وأعود بإجابة دقيقة بدل التخمين."}, {"q": "Describe a time you improved a process.", "a": "I identified a repeated problem, suggested a practical improvement, and worked with the team to make the process clearer.", "ar": "حددت مشكلة متكررة، واقترحت تحسينًا عمليًا، وعملت مع الفريق لجعل العملية أوضح."}, {"q": "What are your career goals?", "a": "My goal is to keep building strong technical and business skills and gradually take on more responsibility.", "ar": "هدفي هو الاستمرار في تطوير مهارات تقنية ومهنية قوية وتحمل مسؤوليات أكبر تدريجيًا."}, {"q": "Are you comfortable working with cross-functional teams?", "a": "Yes. I enjoy working with people from different roles because it helps us understand problems from different perspectives.", "ar": "نعم. أستمتع بالعمل مع أشخاص من تخصصات مختلفة لأنه يساعدنا على فهم المشكلات من زوايا متعددة."}, {"q": "How do you measure success in your work?", "a": "I look at the quality of the outcome, whether goals were achieved, and whether communication and execution were effective.", "ar": "أنظر إلى جودة النتيجة، ومدى تحقيق الأهداف، وفعالية التواصل والتنفيذ."}];

}

function closeInterview(){interview.classList.remove("on");home.classList.remove("hide");window.scrollTo(0,0)}
function renderInterview(){
 interviewStage.innerHTML=`<div class="eyebrow">JOB INTERVIEW ENGLISH</div><h2>تدريب المقابلات الوظيفية</h2>
 <span class="interview-count">${INTERVIEWS.length} سؤال تدريبي</span>
 <p class="artrans">اسمع السؤال أولًا، جاوب من نفسك، وبعدها افتح الإجابة النموذجية. لا تحفظ الإجابة حرفيًا؛ استخدمها لبناء إجابتك أنت.</p>
 ${INTERVIEWS.map((x,i)=>`<div class="interview-card"><h3>${i+1}. ${x.q}</h3>
 <div class="interview-actions">
 <button class="i-btn i-listen" onclick='speak(${JSON.stringify(x.q)})'><span class="i-icon">🔊</span><span>استمع للسؤال</span></button>
 <button class="i-btn i-record" onclick="interviewRecord(${i},this)"><span class="i-icon">🎙</span><span>سجّل إجابتك</span></button>
 </div>
 <details style="margin-top:15px"><summary style="font-weight:900;cursor:pointer;color:#137dab">عرض الإجابة النموذجية والترجمة</summary><div class="answer" style="margin-top:10px">${x.a}<div class="arabic">${x.ar}</div><button class="i-btn i-listen" style="margin-top:10px;width:100%" onclick='speak(${JSON.stringify(x.a)})'>🔊 استمع للإجابة النموذجية</button></div></details>
 <audio id="ia${i}" controls style="display:none;width:100%;margin-top:14px"></audio></div>`).join("")}`;
}
let irec=null,ichunks=[],istream=null;
async function interviewRecord(i,btn){
 try{
  if(irec&&irec.state==="recording"){irec.stop();if(btn)btn.innerHTML="🎙 سجّل إجابتك";return}
  istream=await navigator.mediaDevices.getUserMedia({audio:true});ichunks=[];irec=new MediaRecorder(istream);
  irec.ondataavailable=e=>ichunks.push(e.data);
  irec.onstop=()=>{let a=document.getElementById("ia"+i);a.src=URL.createObjectURL(new Blob(ichunks,{type:irec.mimeType||"audio/webm"}));a.style.display="block";istream.getTracks().forEach(t=>t.stop())};
  irec.start();if(btn)btn.innerHTML="⏹ إيقاف التسجيل";setTimeout(()=>{if(irec&&irec.state==="recording")irec.stop()},60000);
 }catch(e){alert("اسمح للموقع باستخدام الميكروفون من إعدادات المتصفح.")}
}
function renderMap(){
 let out="";
 for(let dayN=1;dayN<=30;dayN++){
   let base=DAYS[dayN-1], first=(dayN-1)*3+1;
   out+=`<section class="unit"><h2>DAY ${dayN} • ${base.topic}</h2><p>3 دروس — خذ درس واحد أو كمل الثلاثة حسب وقتك</p></section><div class="path">`;
   ["Core English","Listening & Story","Speaking Practice"].forEach((label,k)=>{
      let i=first+k,done=progress[i]?.done,open=i===1||progress[i-1]?.done||progress[i]?.done;
      out+=`<button class="lesson ${done?"done":open?"open":""}" ${open?`onclick="start(${i})"`:""}>${done?"★":open?(k===0?"A":k===1?"♫":"●"):"🔒"}<span class="tag">${label}</span></button>`;
   });
   out+="</div>";
 } map.innerHTML=out;stats()
}
function stats(){let done=Object.values(progress).filter(x=>x.done).length;xpEl.textContent=done*100;streakEl.textContent=done}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeSteps(){
 let s=DAYS[contentDay-1].s, other=DAYS[(contentDay)%30].s;
 let dialogue=`Manager: Good morning. Could you give me a quick update?\nYou: ${s[0]}\nManager: Great. Is there anything blocking your progress?\nYou: ${s[3]}`;
 if(lessonMode===0) steps=[
  {type:"learn",q:"جمل أساسية لليوم",items:s},
  {type:"choice",q:"اختر الجملة الأنسب",prompt:"Choose the best workplace sentence:",correct:s[0],opts:shuffle([s[0],other[1],other[2]])},
  {type:"order",q:"رتّب الجملة",correct:s[1]},
  {type:"scenario",q:"موقف في العمل",prompt:"A colleague asks you for an update. Choose the best response.",correct:s[3],opts:shuffle([s[3],other[1],other[4]])},
  {type:"speak",q:"دورك تتكلم",correct:s[4]}
 ];
 else if(lessonMode===1) steps=[
  {type:"story",q:"استمع للمحاورة",story:dialogue},
  {type:"listenq",q:"من طلب التحديث؟",story:dialogue,correct:"The manager",opts:["The manager","The customer","The designer"]},
  {type:"listenq",q:"ما موضوع المحادثة؟",story:dialogue,correct:"A work progress update",opts:["A work progress update","A vacation plan","A restaurant order"]},
  {type:"listen",q:"اسمع واختر الجملة",correct:s[2],opts:shuffle([s[2],other[0],other[3]])},
  {type:"speak",q:"لخّص المحاورة بصوتك",correct:"Give a short spoken summary of the dialogue."}
 ];
 else steps=[
  {type:"speak",q:"اقرأ الجملة بصوتك",correct:s[0]},
  {type:"speak",q:"قلها بدون قراءة إن استطعت",correct:s[1]},
  {type:"scenario",q:"رد على زميلك",prompt:"Colleague: Can you give me a quick update?",correct:s[3],opts:shuffle([s[3],other[1],other[4]])},
  {type:"speak",q:"سجل ردك على الموقف",correct:s[3]},
  {type:"final",q:"اختبار سريع",correct:s[4],opts:shuffle([s[4],other[0],other[2]])}
 ];
}function start(i){D=i;contentDay=Math.floor((D-1)/3)+1;lessonMode=(D-1)%3;step=0;heartsN=999;score=0;answer=null;ordered=[];makeSteps();home.classList.add("hide");lesson.classList.add("on");bottom.style.display="block";window.scrollTo(0,0);render()}
function continueNext(){
 if(D<90){progress[D]={done:true,best:Math.max(score,progress[D]?.best||0)};save();start(D+1)}
 else exitLesson()
}
function exitLesson(){lesson.classList.remove("on");home.classList.remove("hide");bottom.style.display="none";feedback.classList.remove("show");renderMap()}
function speak(t){
 speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.84;u.pitch=1.08;
 let vs=speechSynthesis.getVoices();
 let v=vs.find(x=>/Samantha|Ava|Jenny|Aria|Zira|Female|Google US English/i.test(x.name)&&/^en/i.test(x.lang))
 ||vs.find(x=>/^en-US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));
 if(v)u.voice=v;speechSynthesis.speak(u)
}
function choose(v,el){answer=v;document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");enable()}
function enable(){checkBtn.classList.remove("disabled")}
function render(){answer=null;ordered=[];checkBtn.classList.add("disabled");pbar.style.width=(step/steps.length*100)+"%";hearts.textContent="♥ ∞";let x=steps[step];
if(x.type==="learn"){stage.innerHTML=`<div class="eyebrow">DAY ${contentDay} • ${DAYS[contentDay-1].topic}</div><h2>${x.q}</h2>${x.items.map(t=>`<div class="phrase">${t}<div class="artrans">${ar(t)}</div> <button onclick='speak(${JSON.stringify(t)})' style="float:right;border:0;background:none">🔊</button></div>`).join("")}`;checkBtn.classList.remove("disabled");checkBtn.textContent="ابدأ التحدي";return}

if(x.type==="story"){
 stage.innerHTML=`<div class="eyebrow">WORKPLACE LISTENING</div><h2>${x.q}</h2><div class="scenario" style="white-space:pre-line">${x.story}</div><button class="listen" onclick='speak(${JSON.stringify(x.story)})'>🔊</button><div class="artrans">استمع أولًا بدون قراءة، ثم اقرأ الحوار واسمعه مرة ثانية.</div>`;checkBtn.classList.remove("disabled");return}
if(x.type==="listenq"){
 stage.innerHTML=`<div class="eyebrow">LISTENING COMPREHENSION</div><h2>${x.q}</h2><button class="listen" onclick='speak(${JSON.stringify(x.story)})'>🔊</button><div class="options">${x.opts.map(o=>`<button class="opt" onclick='choose(${JSON.stringify(o)},this)'>${o}</button>`).join("")}</div>`;return}
if(x.type==="speak"){
 stage.innerHTML=`<div class="eyebrow">SPEAKING PRACTICE</div><h2>${x.q}</h2><div class="phrase">${x.correct}<div class="artrans">${ar(x.correct)}</div></div><button id="recBtn" class="listen" onclick="toggleRecord()">🎙️</button><div id="recStatus" style="text-align:center;color:#777">اضغط وسجل صوتك، ثم استمع لنفسك</div><audio id="playback" controls style="width:100%;margin-top:18px;display:none"></audio>`;checkBtn.classList.remove("disabled");return}
if(x.type==="order"){let words=shuffle(x.correct.replace(/[.?]/g,"").split(" "));stage.innerHTML=`<div class="eyebrow">رتّب الكلمات</div><h2>${x.q}</h2><div id="ordered" class="words"></div><div class="bank">${words.map((w,i)=>`<button class="word" onclick="addWord(this,'${w.replace(/'/g,"&#39;")}')">${w}</button>`).join("")}</div>`;return}
if(x.type==="listen"){stage.innerHTML=`<div class="eyebrow">LISTENING</div><h2>${x.q}</h2><button class="listen" onclick='speak(${JSON.stringify(x.correct)})'>🔊</button><div class="options">${x.opts.map(o=>`<button class="opt" onclick='choose(${JSON.stringify(o)},this)'>${o}</button>`).join("")}</div>`;return}
let sc=x.type==="scenario"?`<div class="scenario"><div class="who">DEVELOPER</div><div class="bubble">${x.prompt}</div></div>`:"";
stage.innerHTML=`<div class="eyebrow">${x.type==="final"?"FINAL CHECK":"QUICK PRACTICE"}</div><h2>${x.q}</h2>${sc||`<div class="scenario">${x.prompt||"Choose the best answer:"}</div>`}<div class="options">${x.opts.map(o=>`<button class="opt" onclick='choose(${JSON.stringify(o)},this)'>${o}</button>`).join("")}</div>`}
function addWord(btn,w){ordered.push(w);btn.disabled=true;btn.style.opacity=.35;document.getElementById("ordered").innerHTML=ordered.map(x=>`<span class="word">${x}</span>`).join("");enable()}
let recorder=null,chunks=[],stream=null;
async function toggleRecord(){
 let b=document.getElementById("recBtn"),st=document.getElementById("recStatus");
 if(recorder&&recorder.state==="recording"){recorder.stop();b.textContent="🎙️";st.textContent="تم التسجيل — استمع لنفسك 👇";return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"}),url=URL.createObjectURL(blob),a=document.getElementById("playback");a.src=url;a.style.display="block";stream.getTracks().forEach(t=>t.stop())};
  recorder.start();b.textContent="⏹️";st.textContent="جاري التسجيل... اضغط مرة ثانية للإيقاف";
 }catch(e){st.textContent="اسمح للموقع باستخدام الميكروفون من إعدادات المتصفح ثم حاول مرة أخرى."}
}
function check(){if(checkBtn.classList.contains("disabled"))return;let x=steps[step];if(x.type==="learn"||x.type==="story"||x.type==="speak"){next();return}let ok=x.type==="order"?ordered.join(" ")===x.correct.replace(/[.?]/g,""):answer===x.correct;if(ok){score++;ft.textContent="ممتاز! إجابة صحيحة 🔥";fd.innerHTML="+20 XP<div class=\"explain\">"+ar(x.correct)+"</div>";feedback.className="feedback show"}else{rememberMistake(x.correct);ft.textContent="مو مشكلة، نتعلم منها 💪";fd.innerHTML="<b>الإجابة الصحيحة:</b><div dir=\"ltr\" style=\"margin:6px 0\">"+x.correct+"</div><div class=\"explain\">"+ar(x.correct)+"</div>";feedback.className="feedback bad show"}}
function next(){feedback.classList.remove("show");step++;if(step>=steps.length){finish();return}render()}
function finish(){pbar.style.width="100%";bottom.style.display="none";let pass=true;if(pass){progress[D]={done:true,best:Math.max(score,progress[D]?.best||0)};save()}stage.innerHTML=`<div class="result"><div class="trophy"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="${pass?"#ffc800":"#1cb0f6"}"/><path d="M38 28h44v18c0 19-10 31-22 31S38 65 38 46V28zm-12 8h12v10c-10 0-14-4-12-10zm56 0h12c2 6-2 10-12 10V36zM53 76h14v12h15v10H38V88h15V76z" fill="white"/></svg></div><h1>${pass?"Lesson complete! 🎉":"قريب جدًا! 💪"}</h1><p>${pass?"فتحت لك المرحلة التالية.":"راجع الجمل وأعد المحاولة."}</p><div class="resultgrid"><div class="resultbox"><b>${score}/5</b><br>Correct</div><div class="resultbox"><b>${score*20}</b><br>XP</div></div><button class="check" onclick="continueNext()">${D<90?"ابدأ الدرس التالي ←":"إنهاء الخطة"}</button></div>`}
renderMap();</script></body></html>
