<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Work Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#182033;font-family:system-ui,-apple-system,Segoe UI,Arial}
main{max-width:600px;margin:auto;padding:16px 13px 40px}header{background:#17233c;color:white;padding:20px;border-radius:22px}
h1{margin:0 0 5px;font-size:23px}.sub{font-size:13px;opacity:.8}.progress{height:10px;background:#3a4660;border-radius:99px;margin-top:15px;overflow:hidden}
#bar{height:100%;background:#8fb0ff;width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat,.card{background:white;border-radius:17px;padding:14px;box-shadow:0 2px 12px #17233c0c}.stat{text-align:center}.n{font-size:21px;font-weight:800}.l{font-size:11px;color:#6b7280}
.nav{display:flex;gap:8px;margin:12px 0}button{flex:1;border:0;border-radius:13px;padding:12px;background:#17233c;color:white;font-weight:700}
.daytop{display:flex;justify-content:space-between;align-items:center}.badge{font-size:12px;background:#edf2ff;color:#3154b5;padding:5px 9px;border-radius:999px}
h2{font-size:20px;margin:10px 0}h3{font-size:14px;margin:17px 0 8px}.sentence{padding:10px;background:#f7f8fb;border-radius:12px;margin:7px 0;direction:ltr;text-align:left;font-size:14px}
input[type=checkbox]{width:21px;height:21px;accent-color:#426ee7;vertical-align:middle;margin-right:7px}
.task{display:flex;gap:8px;align-items:center;margin:8px 0}select,textarea{width:100%;border:1px solid #d9deea;border-radius:12px;padding:11px;background:white;font-family:inherit}
textarea{min-height:65px}.help{font-size:12px;color:#667085;line-height:1.7}a{color:#3154b5;font-weight:700;text-decoration:none}
</style></head><body><main>
<header><h1>English Work Tracker 🇬🇧</h1><div class="sub">30 يوم • QA / IT / Software Testing</div><div class="progress"><div id="bar"></div></div><div id="summary" class="sub" style="margin-top:7px"></div></header>
<div class="stats"><div class="stat"><div id="done" class="n">0</div><div class="l">أيام مكتملة</div></div><div class="stat"><div id="minutes" class="n">0</div><div class="l">دقيقة</div></div><div class="stat"><div id="percent" class="n">0%</div><div class="l">الإنجاز</div></div></div>
<div class="nav"><button onclick="prev()">السابق</button><button onclick="next()">التالي</button></div>
<div id="app"></div>
</main><script>
const DAYS=[{"topic": "Introduction & role", "sentences": ["I work as a QA specialist.", "I’m responsible for testing the application.", "I usually start my day by checking my tasks.", "I work closely with developers and the BA team.", "I’m currently working on a new feature."]}, {"topic": "Daily work", "sentences": ["My main responsibility is software testing.", "I test new features before they are released.", "I check whether the requirements are clear.", "I report any issues I find.", "I follow up on bugs until they are fixed."]}, {"topic": "Stand-up update", "sentences": ["Yesterday, I worked on the login feature.", "Today, I’m going to test the new release.", "I’m currently working on the assigned test cases.", "I don’t have any blockers at the moment.", "I’m still waiting for access to the test environment."]}, {"topic": "Requirements", "sentences": ["Could you clarify this requirement?", "What is the expected behavior?", "Could you give me an example?", "Is this scenario included in the requirement?", "What should happen in this case?"]}, {"topic": "Bug reporting", "sentences": ["I found a bug.", "The issue occurs when I submit the form.", "The actual result is different from the expected result.", "I can reproduce the issue.", "The issue happens every time."]}, {"topic": "Developer communication", "sentences": ["Could you take a look at this issue?", "I think the problem is related to the backend.", "Could you check the API response?", "I’ll share the details with you.", "Let me know if you need more information."]}, {"topic": "Week 1 review", "sentences": ["I can introduce myself clearly.", "I can explain my daily tasks.", "I can give a short stand-up update.", "I can ask for clarification.", "I can describe a bug clearly."]}, {"topic": "Test cases", "sentences": ["The precondition is that the user is logged in.", "The first step is to open the page.", "The expected result is that the page opens successfully.", "The actual result is different.", "I’ll update the test case if the requirement changes."]}, {"topic": "Test execution", "sentences": ["I executed the test case successfully.", "The test passed as expected.", "The test failed because of an error.", "I found an issue during execution.", "I’ll attach the evidence to the ticket."]}, {"topic": "Pass / Fail", "sentences": ["The test passed because the result was correct.", "The test failed because the button was not displayed.", "All the main scenarios passed.", "A few negative scenarios failed.", "I need to investigate the failed cases."]}, {"topic": "Retesting", "sentences": ["I retested the issue after the fix.", "The bug is fixed now.", "I can no longer reproduce the issue.", "The issue is still happening.", "Could you deploy the latest fix?"]}, {"topic": "Regression testing", "sentences": ["We need to run regression testing.", "I’ll check the main existing features.", "Regression testing is important before release.", "I’ll focus on the affected areas.", "I’ll share the regression results afterward."]}, {"topic": "Severity & Priority", "sentences": ["This is a high-severity issue.", "I think this should be high priority.", "The issue affects the main user flow.", "This bug can block the release.", "We should discuss the priority with the team."]}, {"topic": "Week 2 review", "sentences": ["I can explain a test case.", "I can report test results.", "I can explain a retest.", "I can discuss regression testing.", "I can explain severity and priority."]}, {"topic": "Meetings", "sentences": ["Can I add something?", "From my side, everything looks good.", "Let me explain the issue briefly.", "Could you repeat that, please?", "I’d like to clarify one point."]}, {"topic": "Giving opinions", "sentences": ["I think we should fix this before release.", "In my opinion, this needs more testing.", "I suggest testing this scenario again.", "From a QA perspective, this is important.", "I have one concern about this change."]}, {"topic": "Agreeing & disagreeing", "sentences": ["I agree with your point.", "I see your point, but I have a concern.", "That makes sense to me.", "I’m not sure I agree with that approach.", "Could we consider another option?"]}, {"topic": "Explaining problems", "sentences": ["The main issue is related to the test environment.", "This affects the user login process.", "We need to investigate the root cause.", "I’ll check it and get back to you.", "We can discuss the next step after that."]}, {"topic": "Blockers", "sentences": ["I’m currently blocked by a missing permission.", "I need access to the test environment.", "I’m waiting for the latest build.", "This is preventing me from completing the test.", "I’ll continue once the blocker is resolved."]}, {"topic": "Status updates", "sentences": ["So far, we have completed the main test cases.", "We still have a few issues to verify.", "Testing is progressing as planned.", "We are waiting for the developer’s fix.", "I’ll provide another update later today."]}, {"topic": "Week 3 review", "sentences": ["I can participate in a meeting.", "I can give my opinion clearly.", "I can disagree politely.", "I can explain a blocker.", "I can give a concise status update."]}, {"topic": "Jira", "sentences": ["I created a ticket in Jira.", "I updated the ticket with the latest evidence.", "I moved the ticket to testing.", "Could you assign this ticket to the right developer?", "I’ll add the steps to reproduce."]}, {"topic": "API testing", "sentences": ["I sent a request to the API.", "The response code is 200.", "The response contains the expected data.", "The API returned an error.", "I’ll check the request and response details."]}, {"topic": "Test environment", "sentences": ["The issue only happens in the test environment.", "The test environment is currently unavailable.", "Could you restart the service?", "The latest build has not been deployed yet.", "I’ll test again after deployment."]}, {"topic": "Release readiness", "sentences": ["From QA’s side, we are ready for release.", "We still have a few issues to fix.", "The critical scenarios have passed.", "I don’t see any major blockers.", "I recommend fixing this issue before release."]}, {"topic": "Test reports", "sentences": ["We executed fifty test cases.", "Forty-five test cases passed.", "Five test cases failed.", "I’ll include the results in the test report.", "The remaining failures are under investigation."]}, {"topic": "Difficult situations", "sentences": ["Let me verify that first.", "I’ll get back to you with an update.", "I’m not sure about that yet.", "Let me check the requirement before I confirm.", "I’ll investigate and share the result."]}, {"topic": "Full QA simulation", "sentences": ["Before we start, let me give you a quick update.", "The main issue we found is this.", "The next step is to retest the fix.", "I’ll share the results after the meeting.", "Does anyone have any questions?"]}, {"topic": "Speaking test", "sentences": ["I can speak without reading my notes.", "I can explain my role and responsibilities.", "I can describe a bug step by step.", "I can answer common QA questions.", "I can keep speaking even if I forget a word."]}, {"topic": "Final assessment", "sentences": ["I can introduce myself confidently.", "I can explain my daily tasks.", "I can give a clear status update.", "I can describe a bug without reading.", "I can participate in a QA meeting in English."]}];
let day=+(localStorage.getItem("ewt-day")||1); let state=JSON.parse(localStorage.getItem("ewt-state")||"{}");
function S(){if(!state[day])state[day]={tasks:[0,0,0,0],sent:[0,0,0,0,0],done:false,confidence:"",understanding:"",speaking:"",notes:""};return state[day]}
function save(){localStorage.setItem("ewt-day",day);localStorage.setItem("ewt-state",JSON.stringify(state));stats()}
function setTask(i,v){S().tasks[i]=v?1:0;save()} function setSent(i,v){S().sent[i]=v?1:0;save()}
function setDone(v){S().done=v;save()} function setV(k,v){S()[k]=v;save()}
function options(v,label){return `<option value="">${label}</option>`+[1,2,3,4,5].map(x=>`<option ${v==x?"selected":""}>${x}</option>`).join("")}
function render(){
 let d=DAYS[day-1],s=S();
 document.getElementById("app").innerHTML=`<section class="card"><div class="daytop"><span class="badge">اليوم ${day} من 30</span><span class="help">${d.topic}</span></div><h2>${d.topic}</h2>
 <h3>خطة الساعة</h3>
 ${["🎧 Listening — 15 دقيقة","🗣️ Shadowing — 15 دقيقة","💬 Speaking — 15 دقيقة","📝 الجمل والمراجعة — 15 دقيقة"].map((x,i)=>`<div class="task"><input type="checkbox" ${s.tasks[i]?"checked":""} onchange="setTask(${i},this.checked)"><span>${x}</span></div>`).join("")}
 <h3>🎧 الاستماع</h3><div class="help">في يوتيوب ابحث عن <b>BBC Learning English English at Work</b>، ولأيام QA التقنية ابحث عن <b>software testing QA English</b>. اسمع أول مرة للفهم، ثم أعد المقطع وكرر الجمل بصوت مرتفع.</div>
 <h3>📝 5 جمل اليوم</h3>
 ${d.sentences.map((x,i)=>`<div class="sentence"><input type="checkbox" ${s.sent[i]?"checked":""} onchange="setSent(${i},this.checked)">${x}</div>`).join("")}
 <h3>📊 تقييم اليوم</h3>
 <select onchange="setV('confidence',this.value)">${options(s.confidence,"الثقة من 5")}</select><br><br>
 <select onchange="setV('understanding',this.value)">${options(s.understanding,"الفهم من 5")}</select><br><br>
 <select onchange="setV('speaking',this.value)">${options(s.speaking,"التحدث من 5")}</select>
 <h3>🗒️ ملاحظاتي</h3><textarea onchange="setV('notes',this.value)" placeholder="اكتب الكلمات أو المواقف التي تحتاج تراجعها...">${s.notes||""}</textarea>
 <div class="task" style="margin-top:15px"><input type="checkbox" ${s.done?"checked":""} onchange="setDone(this.checked)"><b>أنجزت اليوم كاملًا ✅</b></div></section>`;stats()
}
function stats(){let n=Object.values(state).filter(x=>x.done).length,p=Math.round(n/30*100);done.textContent=n;minutes.textContent=n*60;percent.textContent=p+"%";summary.textContent=n+" / 30 يوم مكتمل";bar.style.width=p+"%"}
function prev(){day=Math.max(1,day-1);save();render()}function next(){day=Math.min(30,day+1);save();render()}
render();
</script></body></html>
