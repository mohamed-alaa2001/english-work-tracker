<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f7"><title>QA Quest</title>
<style>
:root{--g:#1cb0f6;--gd:#168ac0;--blue:#1cb0f6;--red:#ff4b4b;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;--bg:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f7f7f7;color:var(--ink)}button{font:inherit}
.app{max-width:560px;margin:auto;min-height:100vh;background:white}.home{padding:18px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:#fffc;backdrop-filter:blur(12px);z-index:5;padding:8px 0 14px}
.brand{font-weight:1000;font-size:22px;color:var(--g)}.stats{display:flex;gap:12px;font-weight:900}.heart{color:var(--red)}.xp{color:#ffb100}
.hero{background:linear-gradient(135deg,#1cb0f6,#49c6ff);border-radius:22px;padding:18px;color:white;box-shadow:0 6px 0 #168ac0;margin:8px 0 24px}.hero h1{margin:0 0 5px;font-size:22px}.hero p{margin:0;opacity:.92;font-size:13px}
.unit{margin:26px 0 12px;text-align:center}.unit h2{font-size:16px;margin:0}.unit p{font-size:12px;color:var(--mut);margin:5px}
.path{display:flex;flex-direction:column;align-items:center;gap:17px}.lesson{position:relative;width:76px;height:76px;border:0;border-radius:50%;background:#e5e5e5;box-shadow:0 7px 0 #cfcfcf;color:#999;font-weight:1000;font-size:18px;transition:.15s}.lesson:nth-child(3n+1){transform:translateX(-45px)}.lesson:nth-child(3n+2){transform:translateX(5px)}.lesson:nth-child(3n){transform:translateX(45px)}
.lesson.open{background:var(--g);box-shadow:0 7px 0 var(--gd);color:white}.lesson.done{background:#ffc800;box-shadow:0 7px 0 #d9aa00;color:white}.lesson:active{transform:translateY(5px)}.lesson svg{display:none}.lesson{font-size:27px;line-height:1}.tag{position:absolute;white-space:nowrap;right:88px;top:20px;background:white;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11px;color:#666}
.lesson-screen{display:none;min-height:100vh;padding:16px 18px 120px}.lesson-screen.on{display:block}.home.hide{display:none}.lhead{display:flex;align-items:center;gap:12px;direction:ltr}.close{border:0;background:none;font-size:25px;color:#aaa}.prog{height:16px;flex:1;background:#e5e5e5;border-radius:99px;overflow:hidden}.prog div{height:100%;background:var(--g);border-radius:99px;transition:.35s}.hearts{color:var(--red);font-weight:1000}
.stage{padding-top:35px}.eyebrow{color:#999;font-size:13px;font-weight:800}.stage h2{font-size:25px;margin:8px 0 20px}.phrase{direction:ltr;text-align:left;border-bottom:2px dashed #ddd;padding:13px 0;font-size:20px;line-height:1.5}.listen{width:82px;height:82px;border:0;border-radius:20px;background:var(--blue);box-shadow:0 6px 0 #168ac0;color:white;font-size:34px;margin:20px auto;display:block}
.options{display:grid;gap:10px}.opt{direction:ltr;text-align:left;padding:15px;border:2px solid var(--line);border-radius:14px;background:white;box-shadow:0 3px 0 var(--line);font-weight:750}.opt.sel{border-color:var(--blue);background:#e8f7fe;color:#137dab}.words{display:flex;flex-wrap:wrap;gap:9px;direction:ltr;min-height:70px;border-bottom:2px solid #eee;padding:10px 0}.word{padding:10px 12px;background:white;border:2px solid #ddd;border-radius:10px;box-shadow:0 2px 0 #ddd}.bank{display:flex;flex-wrap:wrap;gap:9px;direction:ltr;margin-top:22px}.scenario{background:#f7f7f7;border:2px solid #eee;border-radius:18px;padding:16px;direction:ltr;text-align:left;margin-bottom:18px}.who{font-size:12px;color:#999;font-weight:900}.bubble{font-size:18px;margin-top:5px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:white;border-top:2px solid #eee;z-index:10}.check{width:100%;border:0;border-radius:14px;padding:15px;background:var(--g);box-shadow:0 5px 0 var(--gd);color:white;font-weight:1000;text-transform:uppercase}.check.disabled{background:#e5e5e5;box-shadow:0 5px 0 #ccc;color:#aaa}
.feedback{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);padding:18px;background:#dff4ff;z-index:20;display:none}.feedback.bad{background:#ffdfe0}.feedback.show{display:block}.feedback h3{margin:0 0 10px;color:#137dab}.feedback.bad h3{color:#d33131}.feedback button{width:100%;padding:14px;border:0;border-radius:13px;background:var(--g);color:white;font-weight:1000}.feedback.bad button{background:var(--red)}
.result{text-align:center;padding:55px 10px}.trophy{width:125px;height:125px;margin:auto;animation:bounce .7s ease}.trophy svg{width:100%;height:100%}@keyframes bounce{50%{transform:translateY(-12px) rotate(-4deg)}}.result h1{font-size:29px}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:25px 0}.resultbox{border:2px solid #eee;border-radius:15px;padding:13px}.resultbox b{font-size:22px;color:#ffb100}
</style></head><body><div class="app"><main id="home" class="home">
<div class="top"><div class="brand">QA Quest</div><div class="stats"><span class="xp">⚡ <b id="xp">0</b></span><span>🔥 <b id="streak">0</b></span></div></div>
<section class="hero"><h1>English for QA 🚀</h1><p>30 يوم • دروس قصيرة • مواقف من شغلك الحقيقي</p></section>
<div id="map"></div></main>
<main id="lesson" class="lesson-screen"><div class="lhead"><button class="close" onclick="exitLesson()">×</button><div class="prog"><div id="pbar"></div></div><div class="hearts" id="hearts">♥ ∞</div></div><section id="stage" class="stage"></section></main></div>
<div id="bottom" class="bottom" style="display:none"><button id="check" class="check disabled" onclick="check()">تحقق</button></div>
<div id="feedback" class="feedback"><h3 id="ft"></h3><div id="fd"></div><button onclick="next()">متابعة</button></div>
<script>const DAYS=[{"topic": "Introduction & role", "s": ["I work as a QA specialist.", "I’m responsible for testing the application.", "I usually start my day by checking my tasks.", "I work closely with developers and the BA team.", "I’m currently working on a new feature."]}, {"topic": "Daily work", "s": ["My main responsibility is software testing.", "I test new features before they are released.", "I check whether the requirements are clear.", "I report any issues I find.", "I follow up on bugs until they are fixed."]}, {"topic": "Stand-up update", "s": ["Yesterday, I worked on the login feature.", "Today, I’m going to test the new release.", "I’m currently working on the assigned test cases.", "I don’t have any blockers at the moment.", "I’m still waiting for access to the test environment."]}, {"topic": "Requirements", "s": ["Could you clarify this requirement?", "What is the expected behavior?", "Could you give me an example?", "Is this scenario included in the requirement?", "What should happen in this case?"]}, {"topic": "Bug reporting", "s": ["I found a bug.", "The issue occurs when I submit the form.", "The actual result is different from the expected result.", "I can reproduce the issue.", "The issue happens every time."]}, {"topic": "Developer communication", "s": ["Could you take a look at this issue?", "I think the problem is related to the backend.", "Could you check the API response?", "I’ll share the details with you.", "Let me know if you need more information."]}, {"topic": "Week 1 review", "s": ["I can introduce myself clearly.", "I can explain my daily tasks.", "I can give a short stand-up update.", "I can ask for clarification.", "I can describe a bug clearly."]}, {"topic": "Test cases", "s": ["The precondition is that the user is logged in.", "The first step is to open the page.", "The expected result is that the page opens successfully.", "The actual result is different.", "I’ll update the test case if the requirement changes."]}, {"topic": "Test execution", "s": ["I executed the test case successfully.", "The test passed as expected.", "The test failed because of an error.", "I found an issue during execution.", "I’ll attach the evidence to the ticket."]}, {"topic": "Pass / Fail", "s": ["The test passed because the result was correct.", "The test failed because the button was not displayed.", "All the main scenarios passed.", "A few negative scenarios failed.", "I need to investigate the failed cases."]}, {"topic": "Retesting", "s": ["I retested the issue after the fix.", "The bug is fixed now.", "I can no longer reproduce the issue.", "The issue is still happening.", "Could you deploy the latest fix?"]}, {"topic": "Regression testing", "s": ["We need to run regression testing.", "I’ll check the main existing features.", "Regression testing is important before release.", "I’ll focus on the affected areas.", "I’ll share the regression results afterward."]}, {"topic": "Severity & Priority", "s": ["This is a high-severity issue.", "I think this should be high priority.", "The issue affects the main user flow.", "This bug can block the release.", "We should discuss the priority with the team."]}, {"topic": "Week 2 review", "s": ["I can explain a test case.", "I can report test results.", "I can explain a retest.", "I can discuss regression testing.", "I can explain severity and priority."]}, {"topic": "Meetings", "s": ["Can I add something?", "From my side, everything looks good.", "Let me explain the issue briefly.", "Could you repeat that, please?", "I’d like to clarify one point."]}, {"topic": "Giving opinions", "s": ["I think we should fix this before release.", "In my opinion, this needs more testing.", "I suggest testing this scenario again.", "From a QA perspective, this is important.", "I have one concern about this change."]}, {"topic": "Agreeing & disagreeing", "s": ["I agree with your point.", "I see your point, but I have a concern.", "That makes sense to me.", "I’m not sure I agree with that approach.", "Could we consider another option?"]}, {"topic": "Explaining problems", "s": ["The main issue is related to the test environment.", "This affects the user login process.", "We need to investigate the root cause.", "I’ll check it and get back to you.", "We can discuss the next step after that."]}, {"topic": "Blockers", "s": ["I’m currently blocked by a missing permission.", "I need access to the test environment.", "I’m waiting for the latest build.", "This is preventing me from completing the test.", "I’ll continue once the blocker is resolved."]}, {"topic": "Status updates", "s": ["So far, we have completed the main test cases.", "We still have a few issues to verify.", "Testing is progressing as planned.", "We are waiting for the developer’s fix.", "I’ll provide another update later today."]}, {"topic": "Week 3 review", "s": ["I can participate in a meeting.", "I can give my opinion clearly.", "I can disagree politely.", "I can explain a blocker.", "I can give a concise status update."]}, {"topic": "Jira", "s": ["I created a ticket in Jira.", "I updated the ticket with the latest evidence.", "I moved the ticket to testing.", "Could you assign this ticket to the right developer?", "I’ll add the steps to reproduce."]}, {"topic": "API testing", "s": ["I sent a request to the API.", "The response code is 200.", "The response contains the expected data.", "The API returned an error.", "I’ll check the request and response details."]}, {"topic": "Test environment", "s": ["The issue only happens in the test environment.", "The test environment is currently unavailable.", "Could you restart the service?", "The latest build has not been deployed yet.", "I’ll test again after deployment."]}, {"topic": "Release readiness", "s": ["From QA’s side, we are ready for release.", "We still have a few issues to fix.", "The critical scenarios have passed.", "I don’t see any major blockers.", "I recommend fixing this issue before release."]}, {"topic": "Test reports", "s": ["We executed fifty test cases.", "Forty-five test cases passed.", "Five test cases failed.", "I’ll include the results in the test report.", "The remaining failures are under investigation."]}, {"topic": "Difficult situations", "s": ["Let me verify that first.", "I’ll get back to you with an update.", "I’m not sure about that yet.", "Let me check the requirement before I confirm.", "I’ll investigate and share the result."]}, {"topic": "Full QA simulation", "s": ["Before we start, let me give you a quick update.", "The main issue we found is this.", "The next step is to retest the fix.", "I’ll share the results after the meeting.", "Does anyone have any questions?"]}, {"topic": "Speaking test", "s": ["I can speak without reading my notes.", "I can explain my role and responsibilities.", "I can describe a bug step by step.", "I can answer common QA questions.", "I can keep speaking even if I forget a word."]}, {"topic": "Final assessment", "s": ["I can introduce myself confidently.", "I can explain my daily tasks.", "I can give a clear status update.", "I can describe a bug without reading.", "I can participate in a QA meeting in English."]}];
const home=document.getElementById("home"), lesson=document.getElementById("lesson"), map=document.getElementById("map"),
bottom=document.getElementById("bottom"), feedback=document.getElementById("feedback"), stage=document.getElementById("stage"),
pbar=document.getElementById("pbar"), hearts=document.getElementById("hearts"), checkBtn=document.getElementById("check"),
ft=document.getElementById("ft"), fd=document.getElementById("fd"), xpEl=document.getElementById("xp"), streakEl=document.getElementById("streak");
let legacy=JSON.parse(localStorage.getItem("ewt-state")||"{}"), progress=JSON.parse(localStorage.getItem("qaquest-progress")||"{}");
for(let i=1;i<=30;i++)if(legacy[i]?.done&&!progress[i])progress[i]={done:true,best:5};
let D=1,step=0,heartsN=3,score=0,answer=null,ordered=[],steps=[];
const icons={book:`<svg viewBox="0 0 24 24"><path d="M4 3h12a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3V3zm3 14h9V6H7v11z"/></svg>`,star:`<svg viewBox="0 0 24 24"><path d="m12 2 3 6 7 .9-5 4.8 1.3 6.8L12 17.3l-6.3 3.2L7 13.7 2 8.9 9 8z"/></svg>`};
function save(){localStorage.setItem("qaquest-progress",JSON.stringify(progress))}
function unlocked(i){return i===1||progress[i-1]?.done||progress[i]?.done}
function renderMap(){let out="";for(let u=0;u<5;u++){out+=`<section class="unit"><h2>UNIT ${u+1}</h2><p>${DAYS[u*6].topic} → ${DAYS[Math.min(u*6+5,29)].topic}</p></section><div class="path">`;for(let j=1;j<=6;j++){let i=u*6+j,d=DAYS[i-1],done=progress[i]?.done,open=unlocked(i);out+=`<button class="lesson ${done?"done":open?"open":""}" ${open?`onclick="start(${i})"`:""}>${done?"★":open?"▶":"🔒"}${j===1?`<span class="tag">Day ${i} • ${d.topic}</span>`:""}</button>`}out+="</div>"}map.innerHTML=out;stats()}
function stats(){let done=Object.values(progress).filter(x=>x.done).length;xpEl.textContent=done*100;streakEl.textContent=done}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeSteps(){let s=DAYS[D-1].s, other=DAYS[(D)%30].s;steps=[
{type:"learn",q:"تعرّف على جمل اليوم",items:s},
{type:"choice",q:"اختر الجملة المناسبة",prompt:"You need to use this phrase at work:",correct:s[0],opts:shuffle([s[0],other[1],other[2]])},
{type:"order",q:"رتّب الجملة",correct:s[1]},
{type:"listen",q:"اسمع واختر ما سمعت",correct:s[2],opts:shuffle([s[2],other[0],other[3]])},
{type:"scenario",q:"موقف من العمل",prompt:"Developer: “I’ve made the change. What will you do next?”",correct:s[Math.min(3,s.length-1)],opts:shuffle([s[Math.min(3,s.length-1)],other[1],other[4]])},
{type:"final",q:"الاختبار النهائي",correct:s[4],opts:shuffle([s[4],other[0],other[2]])}
]}
function start(i){D=i;step=0;heartsN=999;score=0;answer=null;ordered=[];makeSteps();home.classList.add("hide");lesson.classList.add("on");bottom.style.display="block";window.scrollTo(0,0);render()}
function exitLesson(){lesson.classList.remove("on");home.classList.remove("hide");bottom.style.display="none";feedback.classList.remove("show");renderMap()}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}
function choose(v,el){answer=v;document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");enable()}
function enable(){checkBtn.classList.remove("disabled")}
function render(){answer=null;ordered=[];checkBtn.classList.add("disabled");pbar.style.width=(step/steps.length*100)+"%";hearts.textContent="♥ ∞";let x=steps[step];
if(x.type==="learn"){stage.innerHTML=`<div class="eyebrow">DAY ${D} • ${DAYS[D-1].topic}</div><h2>${x.q}</h2>${x.items.map(t=>`<div class="phrase">${t} <button onclick='speak(${JSON.stringify(t)})' style="float:right;border:0;background:none">🔊</button></div>`).join("")}`;checkBtn.classList.remove("disabled");checkBtn.textContent="ابدأ التحدي";return}
if(x.type==="order"){let words=shuffle(x.correct.replace(/[.?]/g,"").split(" "));stage.innerHTML=`<div class="eyebrow">رتّب الكلمات</div><h2>${x.q}</h2><div id="ordered" class="words"></div><div class="bank">${words.map((w,i)=>`<button class="word" onclick="addWord(this,'${w.replace(/'/g,"&#39;")}')">${w}</button>`).join("")}</div>`;return}
if(x.type==="listen"){stage.innerHTML=`<div class="eyebrow">LISTENING</div><h2>${x.q}</h2><button class="listen" onclick='speak(${JSON.stringify(x.correct)})'>🔊</button><div class="options">${x.opts.map(o=>`<button class="opt" onclick='choose(${JSON.stringify(o)},this)'>${o}</button>`).join("")}</div>`;return}
let sc=x.type==="scenario"?`<div class="scenario"><div class="who">DEVELOPER</div><div class="bubble">${x.prompt}</div></div>`:"";
stage.innerHTML=`<div class="eyebrow">${x.type==="final"?"FINAL CHECK":"QUICK PRACTICE"}</div><h2>${x.q}</h2>${sc||`<div class="scenario">${x.prompt||"Choose the best answer:"}</div>`}<div class="options">${x.opts.map(o=>`<button class="opt" onclick='choose(${JSON.stringify(o)},this)'>${o}</button>`).join("")}</div>`}
function addWord(btn,w){ordered.push(w);btn.disabled=true;btn.style.opacity=.35;document.getElementById("ordered").innerHTML=ordered.map(x=>`<span class="word">${x}</span>`).join("");enable()}
function check(){if(checkBtn.classList.contains("disabled"))return;let x=steps[step];if(x.type==="learn"){next();return}let ok=x.type==="order"?ordered.join(" ")===x.correct.replace(/[.?]/g,""):answer===x.correct;if(ok){score++;ft.textContent="ممتاز! إجابة صحيحة 🔥";fd.textContent="+20 XP";feedback.className="feedback show"}else{ft.textContent="مو مشكلة، نتعلم منها 💪";fd.textContent="الإجابة الصحيحة: "+x.correct;feedback.className="feedback bad show"}}
function next(){feedback.classList.remove("show");step++;if(step>=steps.length){finish();return}render()}
function finish(){pbar.style.width="100%";bottom.style.display="none";let pass=score>=4;if(pass){progress[D]={done:true,best:Math.max(score,progress[D]?.best||0)};save()}stage.innerHTML=`<div class="result"><div class="trophy"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="${pass?"#ffc800":"#1cb0f6"}"/><path d="M38 28h44v18c0 19-10 31-22 31S38 65 38 46V28zm-12 8h12v10c-10 0-14-4-12-10zm56 0h12c2 6-2 10-12 10V36zM53 76h14v12h15v10H38V88h15V76z" fill="white"/></svg></div><h1>${pass?"Lesson complete! 🎉":"قريب جدًا! 💪"}</h1><p>${pass?"فتحت لك المرحلة التالية.":"راجع الجمل وأعد المحاولة."}</p><div class="resultgrid"><div class="resultbox"><b>${score}/5</b><br>Correct</div><div class="resultbox"><b>${score*20}</b><br>XP</div></div><button class="check" onclick="exitLesson()">${pass?"متابعة المسار":"العودة للمسار"}</button></div>`}
renderMap();</script></body></html>
